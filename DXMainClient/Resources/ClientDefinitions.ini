; Client configuration file for XNA CnCNet client
; -------------------------------------------------
; Existing settings omitted for brevity

; -------------------------------------------------
; Stats Dump Parser configuration
; -------------------------------------------------
; Enable or disable the automatic parsing of stats.dmp files.
EnableStatsDumpParser = true

; Path to the INI file that defines unit and side mappings for the stats dump.
; This file should be placed in the client’s working directory or a sub‑folder.
StatsDumpRulesIni = RA1Rules.ini